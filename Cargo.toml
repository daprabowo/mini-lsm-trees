[workspace]
members             = ["mini-lsm", "xtask"]
resolver            = "3"

[workspace.package]
version             = "0.1.0"
edition             = "2024"
rust-version        = "1.97.1"
homepage            = "https://github.com/daprabowo/mini-lsm-trees"
keywords            = ["storage", "database", "tutorial", "course"]
repository          = "https://github.com/daprabowo/mini-lsm-trees"

[workspace.dependencies]
anyhow              = "1"
arc-swap            = "1"
bytes               = "1"
clap                = { version = "4", features = ["derive"] }
console             = "0.16"
crossbeam-epoch     = "0.9"
crossbeam-skiplist  = "0.1"
crossbeam-channel   = "0.5"
duct                = "1"
farmhash            = "1"
moka                = { version = "0.12", features = ["sync"] }
nom                 = "8"
ouroboros           = "0.18"
parking_lot         = "0.12"
rand                = "0.10"
rustyline           = "18"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
